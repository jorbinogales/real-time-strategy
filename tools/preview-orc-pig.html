<!doctype html><html lang="es"><meta charset="utf-8"><title>Vista previa cerdo orco</title>
<style>body{margin:0;background:#cdd4d9;font:14px system-ui}#bar{position:fixed;top:10px;left:10px;background:white;padding:10px;border-radius:8px}</style>
<div id="bar">Cerdo del matadero · <select id="view"><option value="game">Cámara aérea 3/4</option><option value="front">Frente +Z</option><option value="top">Arriba</option></select><span id="status"> Cargando...</span></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#cdd4d9');scene.add(new THREE.HemisphereLight(0xffffff,0x657287,3));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(2,4,4);scene.add(sun);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,30);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.GridHelper(4,8));
const view=document.getElementById('view');function cameraView(){let p=view.value==='top'?[.01,3,.01]:view.value==='front'?[0,1.2,3]:[1.8,2.2,2.4];camera.position.set(...p);camera.lookAt(0,.28,0)}view.onchange=cameraView;cameraView();
new GLTFLoader().load('../assets/props/orc/cerdo.glb',g=>{scene.add(g.scene);document.getElementById('status').textContent=' · listo'},undefined,e=>{document.getElementById('status').textContent=String(e)});
function frame(){requestAnimationFrame(frame);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>

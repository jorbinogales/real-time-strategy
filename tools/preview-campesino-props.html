<!doctype html><html lang="es"><meta charset="utf-8"><title>Campesino y accesorios</title>
<style>body{margin:0;background:#c9d3d7;font:14px system-ui}#bar{position:fixed;top:12px;left:12px;background:white;padding:10px;border-radius:8px;z-index:2}select,input{margin-right:9px}#stats{display:block;margin-top:5px;font:12px monospace}canvas{display:block}</style>
<div id="bar"><select id="tool"><option value="none">Sin herramienta</option><option value="pico">Pico</option><option value="hacha">Hacha</option><option value="azada">Azada</option></select><select id="carry"><option value="none">Sin carga</option><option value="lena">Leña</option><option value="oro">Oro</option><option value="piedra">Piedra</option><option value="comida">Comida</option></select><select id="clip"><option>idle</option><option>work</option><option>walk</option><option>run</option><option>hit</option><option>death</option></select><select id="view"><option value="game">Aérea 3/4</option><option value="front">Frente</option><option value="top">Arriba</option></select><label>Fotograma <input id="phase" type="range" min="0" max="100" value="0"></label><button id="play">Pausar</button><span id="stats">Cargando…</span></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const q=s=>document.querySelector(s),tool=q('#tool'),carry=q('#carry'),clip=q('#clip'),view=q('#view'),phase=q('#phase'),play=q('#play'),stats=q('#stats');
const scene=new THREE.Scene();scene.background=new THREE.Color('#c9d3d7');scene.add(new THREE.HemisphereLight(0xffffff,0x61707b,2.8));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,7,5);scene.add(light);const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshStandardMaterial({color:0xa0aa9a}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);
function cameraView(){camera.position.set(...(view.value==='front'?[0,1.8,4]:view.value==='top'?[.001,4,.001]:[2.25,3.1,3.5]));camera.up.set(0,view.value==='top'?0:1,view.value==='top'?-1:0);camera.lookAt(0,.8,0)}view.onchange=cameraView;cameraView();
const loader=new GLTFLoader(),models={};let farmer,mixer,action,paused=false,handL,handR,shoulderL,shoulderR;
async function glb(url){return new Promise((res,rej)=>loader.load(url+'?v=4',res,undefined,rej))}
async function load(){let g=await glb('../assets/units/human/campesino.glb');farmer=g.scene;scene.add(farmer);mixer=new THREE.AnimationMixer(farmer);farmer.userData.clips=g.animations;for(const name of ['LeftHand','RightHand','LeftShoulder','RightShoulder'])farmer.userData[name]=farmer.getObjectByName(name);handL=farmer.userData.LeftHand;handR=farmer.userData.RightHand;shoulderL=farmer.userData.LeftShoulder;shoulderR=farmer.userData.RightShoulder;for(const [name,url] of Object.entries({pico:'../assets/props/human/pico.glb',hacha:'../assets/props/human/hacha.glb',azada:'../assets/props/human/azada.glb',lena:'../assets/props/carry/lena.glb',oro:'../assets/props/carry/oro.glb',piedra:'../assets/props/carry/piedra.glb',comida:'../assets/props/carry/comida.glb'})){let p=await glb(url);models[name]=p.scene;scene.add(p.scene)}selectClip()}
function selectClip(){mixer.stopAllAction();action=mixer.clipAction(farmer.userData.clips.find(a=>a.name===clip.value));action.play();mixer.setTime(0);phase.value=0}clip.onchange=selectClip;
phase.oninput=()=>{paused=true;play.textContent='Reproducir';mixer.setTime(action.getClip().duration*Number(phase.value)/100)};play.onclick=()=>{paused=!paused;play.textContent=paused?'Reproducir':'Pausar'};
const v=new THREE.Vector3(),u=new THREE.Vector3(),ql=new THREE.Quaternion();
function place(){farmer.updateMatrixWorld(true);const right=handR.getWorldPosition(new THREE.Vector3()),left=handL.getWorldPosition(new THREE.Vector3()),shR=shoulderR.getWorldPosition(new THREE.Vector3()),shL=shoulderL.getWorldPosition(new THREE.Vector3());for(const [name,obj] of Object.entries(models)){obj.visible=name===tool.value||name===carry.value;if(!obj.visible)continue;if(['pico','hacha','azada'].includes(name)){obj.position.copy(right);obj.quaternion.copy(handR.getWorldQuaternion(ql));obj.quaternion.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,-.35)))}else{obj.position.copy(shR).add(shL).multiplyScalar(.5);obj.position.y-=.09;obj.position.z-=.17;obj.quaternion.identity()}}stats.textContent=`${clip.value} ${(action?.time??0).toFixed(2)} s · manos ${right.distanceTo(left).toFixed(3)} m · hombros ${shR.distanceTo(shL).toFixed(3)} m`}
load().catch(e=>{console.error(e);stats.textContent=String(e)});const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);let dt=clock.getDelta();if(mixer){if(!paused)mixer.update(dt);place();if(!paused)phase.value=Math.round(action.time/action.getClip().duration*100)%101}renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
